<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Eligibility funnel and quarterly targets"><title>Eligibility funnel and quarterly targets</title><rect width="1180" height="430" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Who can be selected, and how many each quarter</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">how the rules narrow the list and set the quarterly count · numbers illustrative, not company data</text><rect x="40.0" y="96" width="520.0" height="56" rx="6" fill="#e3eaf1" stroke="#3f5d78"/><text x="300.0" y="121.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">All employees · 1,400</text><text x="300.0" y="139.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">master list</text><rect x="132.9" y="168" width="334.3" height="56" rx="6" fill="#e3eaf1" stroke="#3f5d78"/><text x="300.0" y="193.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Safety-sensitive · 900</text><text x="300.0" y="211.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">pilots, mechanics, dispatchers…</text><rect x="147.7" y="240" width="304.6" height="56" rx="6" fill="#f6e1d4" stroke="#c55e2c"/><text x="300.0" y="265.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Active this quarter · 820</text><text x="300.0" y="283.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">leave and terminations removed</text><text x="300.0" y="330.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="middle" font-weight="400" letter-spacing="1.4">ELIGIBLE POOL</text><text x="640.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">DRUG TESTS PER QUARTER</text><rect x="650" y="151.2" width="70" height="178.8" fill="#c55e2c"/><text x="685.0" y="141.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">52</text><text x="685.0" y="350.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Q1</text><rect x="760" y="151.2" width="70" height="178.8" fill="#c55e2c"/><rect x="760" y="135.5" width="70" height="13.8" fill="#a8801a"/><text x="795.0" y="127.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">56</text><text x="795.0" y="350.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Q2</text><rect x="870" y="151.2" width="70" height="178.8" fill="#c55e2c"/><rect x="870" y="142.4" width="70" height="6.9" fill="#a8801a"/><text x="905.0" y="134.4" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">54</text><text x="905.0" y="350.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Q3</text><rect x="980" y="151.2" width="70" height="178.8" fill="#c55e2c"/><rect x="980" y="132.1" width="70" height="17.2" fill="#a8801a"/><text x="1015.0" y="124.1" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">57</text><text x="1015.0" y="350.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Q4</text><line x1="640" y1="330" x2="1090" y2="330" stroke="#2b1d1d"/><rect x="640" y="360" width="10" height="10" fill="#c55e2c"/><text x="656.0" y="369.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">quarter share of the annual target</text><rect x="640" y="380" width="10" height="10" fill="#a8801a"/><text x="656.0" y="389.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">rollover: selected last quarter, not completed</text><text x="40.0" y="414.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">annual target = rate × average pool size · e.g. 25% × 820 ≈ 205 drug tests a year ≈ 52 a quarter</text></svg>