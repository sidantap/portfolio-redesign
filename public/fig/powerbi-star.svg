<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Illustrative star schema"><title>Illustrative star schema</title><rect width="900" height="420" fill="#fbf6f3"/><text x="40.0" y="40.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">The shape every migrated report ends up in</text><text x="40.0" y="62.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0">illustrative star schema · one fact table, conformed dimensions, measures in DAX</text><line x1="450" y1="240" x2="160" y2="130" stroke="#6a5651" stroke-width="1.2"/><line x1="450" y1="240" x2="740" y2="130" stroke="#6a5651" stroke-width="1.2"/><line x1="450" y1="240" x2="160" y2="350" stroke="#6a5651" stroke-width="1.2"/><line x1="450" y1="240" x2="740" y2="350" stroke="#6a5651" stroke-width="1.2"/><line x1="450" y1="240" x2="450" y2="110" stroke="#6a5651" stroke-width="1.2"/><rect x="85" y="104" width="150" height="52" rx="6" fill="#fff" stroke="#e3d6d0" stroke-width="1.2"/><text x="160.0" y="127.5" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Date</text><text x="160.0" y="144.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">calendar · fiscal</text><rect x="665" y="104" width="150" height="52" rx="6" fill="#fff" stroke="#e3d6d0" stroke-width="1.2"/><text x="740.0" y="127.5" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Department</text><text x="740.0" y="144.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#6a5651" text-anchor="middle" f