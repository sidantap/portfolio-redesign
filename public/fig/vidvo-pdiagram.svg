<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Vidvo P-diagram"><title>Vidvo P-diagram</title><rect width="1180" height="520" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Vidvo as a system: what goes in, what we control, what we can’t</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">P-diagram from our Technology Operation Description · KCV Innovation Fellowship, Research 4</text><rect x="440.0" y="215.0" width="300" height="150" rx="10" fill="#f6e1d4" stroke="#c55e2c" stroke-width="1.6"/><text x="590.0" y="264.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Vidvo</text><text x="590.0" y="292.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">input layer → prompt processing</text><text x="590.0" y="310.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">→ model inference → rendering</text><text x="590.0" y="328.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">→ export (codecs, aspect ratios)</text><text x="60.0" y="200.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#3f5d78" text-anchor="start" font-weight="400" letter-spacing="1.6">INPUTS</text><rect x="60.0" y="216" width="112.4" height="28" rx="14" fill="#e3eaf1" stroke="#3f5d78"/><text x="116.2" y="234.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">User prompts</text><rect x="60.0" y="254" width="177.2" height="28" rx="14" fill="#e3eaf1" stroke="#3f5d78"/><text x="148.6" y="272.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Pre-defined templates</text><rect x="60.0" y="292" width="170.0" height="28" rx="14" fill="#e3eaf1" stroke="#3f5d78"/><text x="145.0" y="310.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">User uploads (media)</text><text x="1120.0" y="200.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#2f7a4f" text-anchor="end" font-weight="400" letter-spacing="1.6">OUTPUTS</text><rect x="978.8" y="216" width="141.2" height="28" rx="14" fill="#e1efe6" stroke="#2f7a4f"/><text x="1049.4" y="234.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Final video file</text><rect x="993.2" y="254" width="126.8" height="28" rx="14" fill="#e1efe6" stroke="#2f7a4f"/><text x="1056.6" y="272.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Preview frames</text><rect x="1022.0" y="292" width="98.0" height="28" rx="14" fill="#e1efe6" stroke="#2f7a4f"/><text x="1071.0" y="310.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Error logs</text><line x1="290" y1="232" x2="436.0" y2="290" stroke="#3f5d78" stroke-width="1.1"/><line x1="290" y1="270" x2="436.0" y2="290" stroke="#3f5d78" stroke-width="1.1"/><line x1="290" y1="308" x2="436.0" y2="290" stroke="#3f5d78" stroke-width="1.1"/><path d="M438.0,290.0 L431.6,292.9 L431.6,287.1 Z" fill="#3f5d78"/><line x1="740.0" y1="290" x2="930" y2="232" stroke="#2f7a4f" stroke-width="1.1"/><path d="M930.0,232.0 L924.7,236.6 L923.1,231.1 Z" fill="#2f7a4f"/><line x1="740.0" y1="290" x2="930" y2="270" stroke="#2f7a4f" stroke-width="1.1"/><path d="M930.0,270.0 L923.9,273.5 L923.3,267.8 Z" fill="#2f7a4f"/><line x1="740.0" y1="290" x2="930" y2="308" stroke="#2f7a4f" stroke-width="1.1"/><path d="M930.0,308.0 L923.4,310.2 L923.9,304.6 Z" fill="#2f7a4f"/><text x="590.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a8801a" text-anchor="middle" font-weight="400" letter-spacing="1.4">CONTROL FACTORS · WE SET THESE</text><rect x="260.0" y="112" width="162.8" height="28" rx="4" fill="#f3ead2" stroke="#a8801a"/><text x="341.4" y="130.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Resolution settings</text><rect x="440.8" y="112" width="148.4" height="28" rx="4" fill="#f3ead2" stroke="#a8801a"/><text x="515.0" y="130.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Export parameters</text><rect x="607.2" y="112" width="177.2" height="28" rx="4" fill="#f3ead2" stroke="#a8801a"/><text x="695.8" y="130.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">GPU allocation limits</text><line x1="590" y1="146" x2="590" y2="212.0" stroke="#a8801a" stroke-width="1.3"/><path d="M590.0,213.0 L587.1,206.6 L592.9,206.6 Z" fill="#a8801a"/><text x="590.0" y="494.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#b23a32" text-anchor="middle" font-weight="400" letter-spacing="1.4">NOISE FACTORS · WE CAN’T CONTROL THESE, ONLY DESIGN FOR THEM</text><rect x="170.0" y="438" width="170.0" height="28" rx="4" fill="#f7e2df" stroke="#b23a32" stroke-dasharray="4 3"/><text x="255.0" y="456.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Internet instability</text><rect x="358.0" y="438" width="126.8" height="28" rx="4" fill="#f7e2df" stroke="#b23a32" stroke-dasharray="4 3"/><text x="421.4" y="456.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">API throttling</text><rect x="502.8" y="438" width="170.0" height="28" rx="4" fill="#f7e2df" stroke="#b23a32" stroke-dasharray="4 3"/><text x="587.8" y="456.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">Unclear user prompts</text><rect x="690.8" y="438" width="148.4" height="28" rx="4" fill="#f7e2df" stroke="#b23a32" stroke-dasharray="4 3"/><text x="765.0" y="456.5" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">High traffic load</text><line x1="590" y1="434" x2="590" y2="368.0" stroke="#b23a32" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M590.0,367.0 L592.9,373.4 L587.1,373.4 Z" fill="#b23a32"/></svg>