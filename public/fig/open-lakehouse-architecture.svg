<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>open-lakehouse architecture</title>
  <desc>BTS monthly zips land once, load into bronze, silver and gold Iceberg tables through DuckDB transforms checked by a data contract, orchestrated by Dagster.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1000" height="430" rx="16" fill="#fcfcfb" stroke="#e4e2db"/>

  <!-- orchestration band -->
  <rect x="24" y="22" width="952" height="44" rx="10" fill="#f0efec"/>
  <text x="44" y="49" font-size="14" font-weight="600" fill="#0b0b0b">Dagster</text>
  <text x="112" y="49" font-size="13" fill="#52514e">monthly partitions · schedule on the 20th (month − 3) · asset checks: reconciliation, quarantine budget · eager gold refresh</text>

  <!-- stages -->
  <g font-size="13" fill="#52514e">
    <rect x="24" y="92" width="170" height="176" rx="12" fill="#ffffff" stroke="#d6d4cc"/>
    <text x="40" y="120" font-size="12" letter-spacing="1.5" fill="#7a786f">SOURCE</text>
    <text x="40" y="146" font-size="16" font-weight="600" fill="#0b0b0b">BTS on-time</text>
    <text x="40" y="168">1 zip per month</text>
    <text x="40" y="188">~600k flights, 110</text>
    <text x="40" y="206">columns, CSV</text>
    <text x="40" y="240" fill="#7a786f" font-size="12">transtats.bts.gov</text>

    <rect x="222" y="92" width="170" height="176" rx="12" fill="#ffffff" stroke="#d6d4cc"/>
    <text x="238" y="120" font-size="12" letter-spacing="1.5" fill="#7a786f">LANDING</text>
    <text x="238" y="146" font-size="16" font-weight="600" fill="#0b0b0b">Immutable files</text>
    <text x="238" y="168">download once,</text>
    <text x="238" y="186">atomic rename</text>
    <text x="238" y="206">manifest: URL, bytes,</text>
    <text x="238" y="224">SHA-256</text>

    <rect x="420" y="92" width="170" height="176" rx="12" fill="#ffffff" stroke="#b07a3c"/>
    <text x="436" y="120" font-size="12" letter-spacing="1.5" fill="#8a5a24">BRONZE · ICEBERG</text>
    <text x="436" y="146" font-size="16" font-weight="600" fill="#0b0b0b">bronze.flights</text>
    <text x="436" y="168">every column as text</text>
    <text x="436" y="186">+ batch, row, file</text>
    <text x="436" y="206">partition: source month</text>
    <text x="436" y="224">schema drift check,</text>
    <text x="436" y="242">additive evolution</text>

    <rect x="618" y="92" width="170" height="176" rx="12" fill="#ffffff" stroke="#7d8a96"/>
    <text x="634" y="120" font-size="12" letter-spacing="1.5" fill="#55636f">SILVER · ICEBERG</text>
    <text x="634" y="146" font-size="16" font-weight="600" fill="#0b0b0b">silver.flights</text>
    <text x="634" y="168">typed, de-duplicated</text>
    <text x="634" y="186">partition: month(date)</text>
    <text x="634" y="214" font-size="16" font-weight="600" fill="#0b0b0b">…_quarantine</text>
    <text x="634" y="236">bad rows + reasons</text>
    <text x="634" y="254">+ raw values</text>

    <rect x="816" y="92" width="160" height="176" rx="12" fill="#ffffff" stroke="#b8941f"/>
    <text x="832" y="120" font-size="12" letter-spacing="1.5" fill="#86680c">GOLD · ICEBERG</text>
    <text x="832" y="146" font-size="16" font-weight="600" fill="#0b0b0b">Star schema</text>
    <text x="832" y="168">fact_flight</text>
    <text x="832" y="186">dim_airport (SCD 2)</text>
    <text x="832" y="204">dim_carrier, dim_date</text>
    <text x="832" y="230" font-size="16" font-weight="600" fill="#0b0b0b">Marts</text>
    <text x="832" y="252">carrier, route, hour</text>
  </g>

  <g stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M194 180 H218"/><path d="M392 180 H416"/><path d="M590 180 H614"/><path d="M788 180 H812"/>
  </g>

  <!-- contract -->
  <rect x="560" y="296" width="300" height="58" rx="10" fill="#f0efec"/>
  <text x="576" y="320" font-size="14" font-weight="600" fill="#0b0b0b">Data contract (YAML)</text>
  <text x="576" y="340" font-size="12.5" fill="#52514e">schema + 98 checks, compiled to DuckDB SQL</text>
  <path d="M703 296 V272" stroke="#52514e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none"/>

  <!-- engine and catalog -->
  <rect x="24" y="296" width="250" height="58" rx="10" fill="#f0efec"/>
  <text x="40" y="320" font-size="14" font-weight="600" fill="#0b0b0b">DuckDB</text>
  <text x="40" y="340" font-size="12.5" fill="#52514e">SQL transforms over Arrow scans</text>
  <rect x="292" y="296" width="250" height="58" rx="10" fill="#f0efec"/>
  <text x="308" y="320" font-size="14" font-weight="600" fill="#0b0b0b">Iceberg catalog (SQLite)</text>
  <text x="308" y="340" font-size="12.5" fill="#52514e">snapshots · time travel · expiry</text>
  <rect x="868" y="296" width="108" height="58" rx="10" fill="#f0efec"/>
  <text x="884" y="320" font-size="14" font-weight="600" fill="#0b0b0b">Report</text>
  <text x="884" y="340" font-size="12.5" fill="#52514e">static page</text>
  <path d="M922 268 V292" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>

  <text x="24" y="392" font-size="12.5" fill="#52514e">Reconciliation on every load: bronze rows = silver rows + quarantined rows; fact rows = silver rows.</text>
  <text x="24" y="412" font-size="12.5" fill="#52514e">Idempotent: a month reload replaces exactly that month's partition. Gold is a full, deterministic rebuild.</text>
</svg>
