<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="Metadata-driven ingestion"><title>Metadata-driven ingestion</title><rect width="1180" height="470" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Adding a table is a config entry, not new code</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">metadata-driven ingestion · illustrative config: names and keys are made up, the pattern is real</text><rect x="40" y="92" width="440" height="320" rx="8" fill="#241a1b"/><text x="56.0" y="114.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#bfa79c" text-anchor="start" font-weight="400" letter-spacing="0">pipelines/lucity/work_orders.json</text><text x="56" y="142" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" xml:space="preserve">{</text><text x="56" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;source&quot;</tspan><tspan fill="#f3e6de">: &quot;lucity&quot;,</tspan></text><text x="56" y="186" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;table&quot;</tspan><tspan fill="#f3e6de">: &quot;work_orders&quot;,</tspan></text><text x="56" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;load&quot;</tspan><tspan fill="#f3e6de">: &quot;incremental&quot;,</tspan></text><text x="56" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;watermark&quot;</tspan><tspan fill="#f3e6de">: &quot;modified_at&quot;,</tspan></text><text x="56" y="252" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;keys&quot;</tspan><tspan fill="#f3e6de">: [&quot;work_order_id&quot;],</tspan></text><text x="56" y="274" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;silver&quot;</tspan><tspan fill="#f3e6de">: {</tspan></text><text x="56" y="296" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">    &quot;dedupe_on&quot;</tspan><tspan fill="#f3e6de">: [&quot;work_order_id&quot;],</tspan></text><text x="56" y="318" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">    &quot;schema&quot;</tspan><tspan fill="#f3e6de">: &quot;work_orders.json&quot;</tspan></text><text x="56" y="340" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" xml:space="preserve">  },</text><text x="56" y="362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">  &quot;gold&quot;</tspan><tspan fill="#f3e6de">: { &quot;scd&quot;: 2,</tspan></text><text x="56" y="384" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#f0a77a">            &quot;track&quot;</tspan><tspan fill="#f3e6de">: [&quot;status&quot;, &quot;asset_id&quot;] }</tspan></text><text x="56" y="406" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" xml:space="preserve">}</text><rect x="560" y="104" width="580" height="58" rx="6" fill="#fff" stroke="#3f5d78" stroke-width="1.3"/><rect x="560" y="104" width="6" height="58" fill="#3f5d78"/><text x="582.0" y="129.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Data Factory reads the config</text><text x="582.0" y="148.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">one generic pipeline for every SQL Server table</text><rect x="560" y="190" width="580" height="58" rx="6" fill="#fff" stroke="#9a8580" stroke-width="1.3"/><rect x="560" y="190" width="6" height="58" fill="#9a8580"/><text x="582.0" y="215.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">bronze.lucity_work_orders</text><text x="582.0" y="234.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">rows newer than modified_at, appended as Delta</text><line x1="600" y1="162" x2="600" y2="187" stroke="#6a5651"/><path d="M600.0,188.0 L597.1,181.6 L602.9,181.6 Z" fill="#6a5651"/><rect x="560" y="276" width="580" height="58" rx="6" fill="#fff" stroke="#3f5d78" stroke-width="1.3"/><rect x="560" y="276" width="6" height="58" fill="#3f5d78"/><text x="582.0" y="301.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">silver.work_orders</text><text x="582.0" y="320.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">typed, deduplicated on work_order_id</text><line x1="600" y1="248" x2="600" y2="273" stroke="#6a5651"/><path d="M600.0,274.0 L597.1,267.6 L602.9,267.6 Z" fill="#6a5651"/><rect x="560" y="362" width="580" height="58" rx="6" fill="#fff" stroke="#c55e2c" stroke-width="1.3"/><rect x="560" y="362" width="6" height="58" fill="#c55e2c"/><text x="582.0" y="387.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">gold.dim_work_order</text><text x="582.0" y="406.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">SCD 2 on status and asset_id</text><line x1="600" y1="334" x2="600" y2="359" stroke="#6a5651"/><path d="M600.0,360.0 L597.1,353.6 L602.9,353.6 Z" fill="#6a5651"/><path d="M480.0,232.0 C519.0,232.0 519.0,133.0 558.0,133.0" fill="none" stroke="#c55e2c" stroke-width="1.5"/><path d="M558.0,133.0 L551.6,135.9 L551.6,130.1 Z" fill="#c55e2c"/><text x="560.0" y="448.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">REST APIs don’t fit one template, so they get notebooks for each API’s auth and pagination</text></svg>