<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="One post through the NLP pipeline"><title>One post through the NLP pipeline</title><rect width="1180" height="470" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">One post’s path through the pipeline</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">made-up example post and scores · the steps are the pipeline’s</text><text x="40.0" y="108.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">POST</text><rect x="150" y="86" width="990" height="62" rx="6" fill="#fff" stroke="#e5d8d2"/><text x="166.0" y="110.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0" font-style="italic">“Third night shift in a row and I’m exhausted. My preceptor is great but I cried in the break room again. Is it</text><text x="166.0" y="130.0" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0" font-style="italic">supposed to feel like this?”</text><text x="40.0" y="196.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">CLEAN</text><text x="150.0" y="196.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">third night shift row exhausted preceptor great cried break room supposed feel</text><text x="150.0" y="216.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0">lowercase · punctuation and stop words removed</text><text x="40.0" y="265.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">LEMMATIZE</text><rect x="150.0" y="248" width="61.0" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="180.5" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">third</text><rect x="219.0" y="248" width="61.0" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="249.5" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">night</text><rect x="288.0" y="248" width="61.0" height="26" rx="13" fill="#f3ead2" stroke="#a8801a"/><text x="318.5" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">shift</text><rect x="357.0" y="248" width="44.6" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="379.3" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">row</text><rect x="409.6" y="248" width="77.4" height="26" rx="13" fill="#f7e2df" stroke="#b23a32"/><text x="448.3" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">exhaust</text><rect x="495.0" y="248" width="93.8" height="26" rx="13" fill="#f3ead2" stroke="#a8801a"/><text x="541.9" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">preceptor</text><rect x="596.8" y="248" width="61.0" height="26" rx="13" fill="#e1efe6" stroke="#2f7a4f"/><text x="627.3" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">great</text><rect x="665.8" y="248" width="44.6" height="26" rx="13" fill="#e3eaf1" stroke="#3f5d78"/><text x="688.1" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">cry</text><rect x="718.4" y="248" width="61.0" height="26" rx="13" fill="#f3ead2" stroke="#a8801a"/><text x="748.9" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">break</text><rect x="787.4" y="248" width="52.8" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="813.8" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">room</text><rect x="848.2" y="248" width="77.4" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="886.9" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">suppose</text><rect x="933.6" y="248" width="52.8" height="26" rx="13" fill="#fff" stroke="#e5d8d2"/><text x="960.0" y="265.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">feel</text><text x="150.0" y="294.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0">exhausted → exhaust, cried → cry: forms of a word count as one</text><text x="40.0" y="348.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">CLASSIFY</text><text x="150.0" y="346.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Stress</text><rect x="150" y="354" width="200" height="10" rx="5" fill="#efe5e0"/><rect x="150" y="354" width="156" height="10" rx="5" fill="#b23a32"/><text x="400.0" y="346.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Depression</text><rect x="400" y="354" width="200" height="10" rx="5" fill="#efe5e0"/><rect x="400" y="354" width="92" height="10" rx="5" fill="#3f5d78"/><text x="650.0" y="346.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Workplace</text><rect x="650" y="354" width="200" height="10" rx="5" fill="#efe5e0"/><rect x="650" y="354" width="122" height="10" rx="5" fill="#a8801a"/><text x="900.0" y="346.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Wellbeing</text><rect x="900" y="354" width="200" height="10" rx="5" fill="#efe5e0"/><rect x="900" y="354" width="24" height="10" rx="5" fill="#2f7a4f"/><text x="150.0" y="384.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0">posts are then counted by theme over time in the R Shiny dashboard</text></svg>