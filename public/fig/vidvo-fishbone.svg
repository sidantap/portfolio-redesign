<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="Vidvo failure modes and technology readiness"><title>Vidvo failure modes and technology readiness</title><rect width="1180" height="560" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Where an export could go wrong, and how ready the technology is</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">failure modes from our TOD and TRL analysis, as an Ishikawa diagram · KCV Innovation Fellowship, Research 4</text><line x1="60" y1="250" x2="960" y2="250" stroke="#2b1d1d" stroke-width="2.4"/><path d="M964.0,250.0 L953.0,254.9 L953.0,245.1 Z" fill="#2b1d1d"/><rect x="974" y="210" width="176" height="80" rx="8" fill="#f7e2df" stroke="#b23a32" stroke-width="1.5"/><text x="1062.0" y="242.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">A failed or</text><text x="1062.0" y="264.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">off-brand export</text><line x1="220" y1="100" x2="400" y2="250" stroke="#c55e2c" stroke-width="1.8"/><text x="214.0" y="90.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">TECHNOLOGY</text><line x1="41.0" y1="137.5" x2="265.0" y2="137.5" stroke="#6a5651" stroke-width="1"/><path d="M265.0,137.5 L260.4,139.5 L260.4,135.5 Z" fill="#6a5651"/><text x="251.0" y="131.5" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">GPU / render pipeline overload</text><line x1="125.6" y1="175.0" x2="310.0" y2="175.0" stroke="#6a5651" stroke-width="1"/><path d="M310.0,175.0 L305.4,177.0 L305.4,173.0 Z" fill="#6a5651"/><text x="296.0" y="169.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Codec or export failures</text><line x1="177.2" y1="212.5" x2="355.0" y2="212.5" stroke="#6a5651" stroke-width="1"/><path d="M355.0,212.5 L350.4,214.5 L350.4,210.5 Z" fill="#6a5651"/><text x="341.0" y="206.5" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Autosave not triggering</text><line x1="620" y1="100" x2="800" y2="250" stroke="#c55e2c" stroke-width="1.8"/><text x="614.0" y="90.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">MEASUREMENT</text><line x1="495.6" y1="150.0" x2="680.0" y2="150.0" stroke="#6a5651" stroke-width="1"/><path d="M680.0,150.0 L675.4,152.0 L675.4,148.0 Z" fill="#6a5651"/><text x="666.0" y="144.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">No QC step before export</text><line x1="555.6" y1="200.0" x2="740.0" y2="200.0" stroke="#6a5651" stroke-width="1"/><path d="M740.0,200.0 L735.4,202.0 L735.4,198.0 Z" fill="#6a5651"/><text x="726.0" y="194.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Vague or unclear prompts</text><line x1="220" y1="400" x2="400" y2="250" stroke="#c55e2c" stroke-width="1.8"/><text x="214.0" y="422.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">ENVIRONMENT</text><line x1="135.2" y1="350.0" x2="280.0" y2="350.0" stroke="#6a5651" stroke-width="1"/><path d="M280.0,350.0 L275.4,352.0 L275.4,348.0 Z" fill="#6a5651"/><text x="266.0" y="344.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Network throttling</text><line x1="221.6" y1="300.0" x2="340.0" y2="300.0" stroke="#6a5651" stroke-width="1"/><path d="M340.0,300.0 L335.4,302.0 L335.4,298.0 Z" fill="#6a5651"/><text x="326.0" y="294.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">High user load</text><line x1="620" y1="400" x2="800" y2="250" stroke="#c55e2c" stroke-width="1.8"/><text x="614.0" y="422.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">METHOD</text><line x1="454.2" y1="362.5" x2="665.0" y2="362.5" stroke="#6a5651" stroke-width="1"/><path d="M665.0,362.5 L660.4,364.5 L660.4,360.5 Z" fill="#6a5651"/><text x="651.0" y="356.5" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Incorrect branding placement</text><line x1="532.2" y1="325.0" x2="710.0" y2="325.0" stroke="#6a5651" stroke-width="1"/><path d="M710.0,325.0 L705.4,327.0 L705.4,323.0 Z" fill="#6a5651"/><text x="696.0" y="319.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">No aspect-ratio presets</text><line x1="550.8" y1="287.5" x2="755.0" y2="287.5" stroke="#6a5651" stroke-width="1"/><path d="M755.0,287.5 L750.4,289.5 L750.4,285.5 Z" fill="#6a5651"/><text x="741.0" y="281.5" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2b1d1d" text-anchor="end" font-weight="400" letter-spacing="0">Missing copyright filtering</text><text x="60.0" y="450.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#3f5d78" text-anchor="start" font-weight="400" letter-spacing="1.4">TECHNOLOGY READINESS LEVEL</text><rect x="60.0" y="464" width="111.8" height="30" rx="4" fill="#fff" stroke="#e5d8d2"/><text x="115.9" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 1</text><rect x="177.8" y="464" width="111.8" height="30" rx="4" fill="#fff" stroke="#e5d8d2"/><text x="233.7" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 2</text><rect x="295.6" y="464" width="111.8" height="30" rx="4" fill="#c55e2c" stroke="#c55e2c"/><text x="351.4" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 3</text><rect x="413.3" y="464" width="111.8" height="30" rx="4" fill="#c55e2c" stroke="#c55e2c"/><text x="469.2" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#fff" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 4</text><rect x="531.1" y="464" width="111.8" height="30" rx="4" fill="#f6e1d4" stroke="#c55e2c"/><text x="587.0" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 5</text><rect x="648.9" y="464" width="111.8" height="30" rx="4" fill="#f6e1d4" stroke="#c55e2c"/><text x="704.8" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 6</text><rect x="766.7" y="464" width="111.8" height="30" rx="4" fill="#f6e1d4" stroke="#c55e2c"/><text x="822.6" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 7</text><rect x="884.4" y="464" width="111.8" height="30" rx="4" fill="#fff" stroke="#e5d8d2"/><text x="940.3" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 8</text><rect x="1002.2" y="464" width="111.8" height="30" rx="4" fill="#fff" stroke="#e5d8d2"/><text x="1058.1" y="484.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#2b1d1d" text-anchor="middle" font-weight="400" letter-spacing="0">TRL 9</text><text x="354.4" y="516.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#c55e2c" text-anchor="middle" font-weight="400" letter-spacing="0">now: 3–4 · early prototype</text><text x="707.8" y="516.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#6a5651" text-anchor="middle" font-weight="400" letter-spacing="0">next: 5–7 · build countermeasures and validate them</text></svg>