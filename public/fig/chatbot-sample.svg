<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-label="Anatomy of a training sample"><title>Anatomy of a training sample</title><rect width="1180" height="500" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Anatomy of one training sample</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">the question and answer are the real example from our poster; the layout is the instruction format we trained on</text><rect x="40" y="92" width="700" height="350" rx="8" fill="#241a1b"/><text x="58.0" y="122.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">{</text><text x="74.0" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f0a77a" text-anchor="start" font-weight="400" letter-spacing="0">&quot;instruction&quot;:</text><text x="92.0" y="168.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">&quot;Answer the question about Northern Kentucky University.&quot;</text><text x="74.0" y="197.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f0a77a" text-anchor="start" font-weight="400" letter-spacing="0">&quot;input&quot;:</text><text x="92.0" y="219.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">&quot;What is the mission of NKU?&quot;</text><text x="74.0" y="248.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f0a77a" text-anchor="start" font-weight="400" letter-spacing="0">&quot;output&quot;:</text><text x="92.0" y="270.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">&quot;As a public comprehensive university located in a major metropolitan</text><text x="92.0" y="289.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">area, NKU delivers innovative, student-centered education and engages in</text><text x="92.0" y="308.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">impactful, scholarly, and creative endeavors. These efforts empower</text><text x="92.0" y="327.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">graduates to have fulfilling careers and meaningful lives while</text><text x="92.0" y="346.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">contributing to the economic, civic, and social vitality of the region.&quot;</text><text x="58.0" y="375.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#f3e6de" text-anchor="start" font-weight="400" letter-spacing="0">}</text><line x1="740" y1="142" x2="774" y2="142" stroke="#c55e2c"/><circle cx="740" cy="142" r="3" fill="#c55e2c"/><text x="784.0" y="138.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">INSTRUCTION</text><text x="784.0" y="156.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">the task, the same for every NKU sample</text><line x1="740" y1="193" x2="774" y2="193" stroke="#c55e2c"/><circle cx="740" cy="193" r="3" fill="#c55e2c"/><text x="784.0" y="189.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">INPUT</text><text x="784.0" y="207.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">a question someone might really ask</text><line x1="740" y1="244" x2="774" y2="244" stroke="#c55e2c"/><circle cx="740" cy="244" r="3" fill="#c55e2c"/><text x="784.0" y="240.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">OUTPUT</text><text x="784.0" y="258.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">the answer, formatted with GPT-4o from the</text><text x="784.0" y="275.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">page text and reviewed by hand</text><text x="40.0" y="476.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">nku.edu pages → text (Jina reader) → 1,611 samples like this one → fine-tune GPT-2 (1.5B) → +10–15% vs. ChatGPT on 10 NKU questions</text></svg>