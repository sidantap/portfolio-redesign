<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Incremental load windows with overlap"><title>Incremental load windows with overlap</title><rect width="1100" height="360" fill="#fbf6f3"/><text x="40.0" y="42.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">Each night loads only what changed, plus a safety overlap</text><text x="40.0" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0.4">Cincinnati 311 · watermark = newest date_last_update already loaded · overlap = 2 days · dates illustrative</text><line x1="150.0" y1="92" x2="150.0" y2="304" stroke="#e5d8d2"/><text x="187.9" y="324.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Oct 20</text><line x1="225.8" y1="92" x2="225.8" y2="304" stroke="#e5d8d2"/><text x="263.8" y="324.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Oct 21</text><line x1="301.7" y1="92" x2="301.7" y2="304" stroke="#e5d8d2"/><text x="339.6" y="324.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Oct 22</text><line x1="377.5" y1="92" x2="377.5" y2="304" stroke="#e5d8d2"/><text x="415.4" y="324.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="middle" font-weight="400" letter-spacing="0">Oct 23</text><line x1="453.3" y1="92" x2="453.3" y2="304" stroke="#e5d8d2"/><text x="491.2" y="324.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9a8580" text-anchor="m