<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="SCD Type 2 illustration"><title>SCD Type 2 illustration</title><rect width="1000" height="330" fill="#fbf6f3"/><text x="40.0" y="40.0" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b1d1d" text-anchor="start" font-weight="400" letter-spacing="0">SCD Type 2: keep history instead of overwriting it</text><text x="40.0" y="62.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#9a8580" text-anchor="start" font-weight="400" letter-spacing="0">illustration with made-up rows · a meter changes size, and both versions are kept</text><text x="40.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">meter_key</text><text x="150.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">meter_id</text><text x="260.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">size</text><text x="350.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">valid_from</text><text x="490.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">valid_to</text><text x="630.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0.8">is_current</text><line x1="40" y1="110" x2="750" y2="110" stroke="#2b1d1d"/><text x="40.0" y="136.0" font-family="ui-monospace, 'SF Mono'