or history</text><text x="780.0" y="176.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="0">new version: current</text><text x="40.0" y="258.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">TYPE 1</text><text x="150.0" y="258.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">overwrite in place, for corrections where history doesn’t matter</text><text x="40.0" y="282.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#c55e2c" text-anchor="start" font-weight="400" letter-spacing="1.4">TYPE 2</text><text x="150.0" y="282.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#6a5651" text-anchor="start" font-weight="400" letter-spacing="0">new row with a new surrogate key; facts join to the version that was true then</text></svg>